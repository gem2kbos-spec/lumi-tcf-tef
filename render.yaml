services:
  - type: web
    name: lumi-tcf-tef
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_QR_URL
        sync: false
      - key: AI_DAILY_LIMIT
        value: 100
      - key: PRICE_MONTH_CNY
        value: 39
      - key: PRICE_QUARTER_CNY
        value: 89
      - key: PRICE_HALF_YEAR_CNY
        value: 159
      - key: SUPPORT_CONTACT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
