<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AI 驱动的 TCF 与 TEF 法语训练器" />
  <title>Lumi TCF · TEF Trainer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <header>
      <div class="brand"><span>lu</span> Lumi Français</div>
      <div id="ai-status" class="status">正在连接…</div>
    </header>
    <section class="hero">
      <p class="eyebrow">TCF 预签证 / DAP · 连续刷题</p>
      <h1>把每一次错误，<br><em>变成下一道对的题。</em></h1>
      <p class="intro">两个考试共用一套能力档案。重复出现的词汇、语法和理解能力只记一次，练习会持续回到你的真实薄弱点。</p>
    </section>
    <section class="exam-hub">
      <div class="exam-tabs" role="group" aria-label="选择考试">
        <button class="active" data-exam="tcf"><strong>TCF</strong><span>预签证 / DAP</span></button>
        <button data-exam="tef"><strong>TEF</strong><span>全题型训练</span></button>
      </div>
      <div><div class="hub-heading"><div><p class="label">选择专项</p><h2 id="exam-title">TCF Tout Public</h2></div><p id="exam-note">三项 QCM + 写作 + 口语</p></div><div id="module-grid" class="module-grid"></div></div>
    </section>
    <section class="dashboard">
      <aside>
        <p class="label">训练设置</p>
        <div class="toggle legacy-toggle" role="group" aria-label="题目类型">
          <button class="active" data-type="grammar">语法</button>
          <button data-type="vocabulary">词汇</button>
          <button data-type="reading">阅读</button>
        </div>
        <label>目标等级<select id="level"><option>B1</option><option>A2</option></select></label>
        <label id="count-label">本组题数<select id="count"><option>1</option></select></label>
        <button id="start" class="primary">开始连续刷题 <span>→</span></button>
        <button id="review" class="secondary">复习错题 <span id="review-count">0</span></button>
        <div class="stats">
          <div><strong id="accuracy">0%</strong><span>正确率</span></div>
          <div><strong id="total">0</strong><span>已答题</span></div>
          <div><strong id="streak">0</strong><span>连续天数</span></div>
        </div>
        <div id="weak-card" class="weak-card" hidden><p class="label">当前薄弱点</p><div id="weak-skills"></div></div>
      </aside>
      <section id="practice" class="practice empty">
        <div id="welcome">
          <div class="orb">L</div>
          <h2>Prêt à commencer ?</h2>
          <p>选择必考专项，然后开始连续刷题。</p>
        </div>
        <div id="quiz" hidden>
          <div id="notice" class="notice" hidden></div>
          <div class="progress-row"><span id="counter"></span><span id="source"></span></div>
          <div class="progress-bar"><i id="progress"></i></div>
          <p id="topic" class="eyebrow"></p>
          <button id="play-audio" class="audio-button" hidden>▶ 播放音频（仅一次）</button>
          <article id="passage" class="passage" hidden></article>
          <h2 id="prompt"></h2>
          <div id="options" class="options" aria-live="polite"></div>
          <div id="feedback" aria-live="polite" hidden></div>
          <button id="next" class="primary" hidden>下一道随机题 <span>→</span></button>
        </div>
        <div id="production" hidden>
          <div class="progress-row"><span id="production-exam"></span><span id="production-format"></span></div>
          <p id="production-topic" class="eyebrow"></p>
          <h2 id="production-prompt"></h2>
          <div id="production-guidance" class="passage"></div>
          <textarea id="production-answer" rows="10" placeholder="在这里练习作答……"></textarea>
          <div class="production-footer"><span id="word-count">0 mots</span><button id="new-production" class="primary">换一道题 <span>↻</span></button></div>
        </div>
        <div id="finished" hidden>
          <div class="orb">✓</div><h2>这一组完成了</h2><p id="result"></p>
          <div id="session-summary" class="session-summary"></div>
          <button id="again" class="primary">再练一组 <span>→</span></button>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
